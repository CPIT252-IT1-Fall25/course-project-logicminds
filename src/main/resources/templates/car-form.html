<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Used Car Estimator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
<div class="card p-4 shadow" style="width: 400px;">
    <h2 class="card-title text-center mb-4">Car Details</h2>
    <form th:action="@{/estimate}" method="post">
        <div class="mb-3">
            <label class="form-label">Company:</label>
            <select class="form-control" name="make">
                <option value="Toyota">Toyota</option>
                <option value="Hyundai">Hyundai</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Model:</label>
            <input type="text" class="form-control" name="model" placeholder="e.g., Camry"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Year:</label>
            <input type="number" class="form-control" name="year" placeholder="e.g., 2020"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Mileage:</label>
            <input type="number" class="form-control" name="mileage" placeholder="e.g., 30000"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Accident Severity:</label>
            <select class="form-control" name="accidentSeverity">
                <option value="none">None</option>
                <option value="light">Light</option>
                <option value="medium">Medium</option>
                <option value="heavy">Heavy</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Estimate Price</button>
    </form>
</div>
</body>
</html>
