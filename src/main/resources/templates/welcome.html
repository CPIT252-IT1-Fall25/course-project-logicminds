<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Welcome | Car Estimator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url('/images/camry.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Poppins", sans-serif;
        }

        .welcome-box {
            text-align: center;
            background: rgba(255,255,255,0.85);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0px 15px 35px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.8s ease-in-out;
        }

        h1 { font-weight:700; color:#1e293b; }

        .btn-start {
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 12px;
        }

        @keyframes fadeIn {
            from {opacity:0; transform:translateY(25px);}
            to {opacity:1; transform:translateY(0);}
        }
    </style>
</head>

<body>
<div class="welcome-box">
    <h1>Used Car Estimator</h1>
    <p class="text-secondary mb-4">Estimate your car value in seconds</p>

    <a href="/login" class="btn btn-primary btn-start">Start</a>
</div>
</body>
</html>
