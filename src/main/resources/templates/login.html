<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Used Car Estimator - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('/images/camry.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            border-radius: 20px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 12px 35px rgba(0,0,0,0.3);
        }

        .card h2 {
            color: #1e3c72;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .btn-primary {
            background: linear-gradient(to right, #f7971e, #ffd200);
            border: none;
            font-weight: bold;
        }

        .btn-primary:hover {
            background: linear-gradient(to right, #ffd200, #f7971e);
        }

        label {
            font-weight: 500;
        }

        p.text-muted {
            color: #555;
        }

        .text-danger {
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="card" style="width: 400px;">
    <h2 class="text-center">Welcome to Used Car Estimator</h2>
    <p class="text-center text-muted mb-4">Enter your credentials to continue</p>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Username:</label>
            <input type="text" class="form-control" name="username" placeholder="Enter username"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Password:</label>
            <input type="password" class="form-control" name="password" placeholder="Enter password"/>
        </div>

        <div th:if="${error}" class="text-danger mb-3">
            <p th:text="${error}"></p>
        </div>

        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
</div>
</body>
</html>
