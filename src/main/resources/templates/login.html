<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login | Car Estimator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            background: url('/images/login.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Poppins", sans-serif;
        }

        .card {
            width: 380px;
            border-radius: 18px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0px 15px 35px rgba(0,0,0,0.2);
            animation: fadeIn .7s ease-in-out;
        }

        .form-control {
            height: 48px;
            border-radius: 12px;
        }

        .btn-primary {
            height: 48px;
            border-radius: 12px;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from {opacity:0; transform:translateY(25px);}
            to {opacity:1; transform:translateY(0);}
        }
    </style>
</head>

<body>

<div class="card">
    <h3 class="text-center mb-3">Welcome Back</h3>
    <p class="text-center text-muted">Login to continue</p>

    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label>Username</label>
            <input class="form-control" name="username" placeholder="admin">
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" class="form-control" name="password" placeholder="1234">
        </div>

        <div th:if="${error}" class="text-danger text-center mb-2">
            <span th:text="${error}"></span>
        </div>

        <button class="btn btn-primary w-100 mt-3">Login</button>
    </form>

</div>

</body>
</html>
