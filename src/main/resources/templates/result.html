<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Car Estimate Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url('/images/result.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Poppins", sans-serif;
        }

        .card {
            width: 420px;
            background: rgba(255,255,255,0.9);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0px 20px 45px rgba(0,0,0,0.25);
            animation: fadeIn 0.6s ease-in-out;
        }

        h3 {
            font-weight: 700;
            color: #1e293b;
        }

        .btn-secondary {
            height: 48px;
            border-radius: 12px;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(25px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>

</head>

<body>

<div class="card">

    <h3 class="mb-3 text-center">Estimation Result</h3>

    <p><strong>Car:</strong> <span th:text="${car.toString()}"></span></p>

    <p>
        <strong>Estimated Range:</strong>
        <span th:text="${min}"></span> — <span th:text="${max}"></span> SAR
    </p>

    <p class="text-primary">
        Final Estimated Value:
        <strong><span th:text="${final}"></span> SAR</strong>
    </p>

    <a href="/car-form" class="btn btn-secondary w-100 mt-3">Estimate Another Car</a>
</div>

</body>
</html>
