<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estimated Price</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
<div class="card p-4 shadow" style="width: 400px;">
    <h2 class="card-title text-center mb-4">Car Price Estimation</h2>
    <p><strong>Car:</strong> <span th:text="${car.toString()}"></span></p>
    <p><strong>Estimated Price:</strong> $<span th:text="${estimatedPrice}"></span></p>
    <a href="/car-form" class="btn btn-secondary w-100">Estimate Another Car</a>
</div>
</body>
</html>
